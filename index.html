<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Smooth tab transition */
        .tab-content { display: none; animation: fadeIn 0.2s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Mobile tweaks */
        .mobile-height { min-height: calc(100vh - 180px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- PASSWORD OVERLAY -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <div class="mb-6">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-blue-200">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold mt-4 text-gray-900">Sync Space</h1>
                <p class="text-gray-500 text-sm mt-1">Enter passcode to access your vault</p>
            </div>
            <input type="password" id="pass-input" placeholder="Passcode" class="w-full text-center text-2xl tracking-widest p-4 rounded-xl border-2 border-gray-200 focus:border-blue-500 focus:outline-none transition-all mb-4">
            <button onclick="checkPass()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all transform active:scale-95">
                Unlock
            </button>
            <p id="error-msg" class="text-red-500 text-sm mt-3 hidden">Incorrect passcode</p>
        </div>
    </div>

    <!-- MAIN APP (Hidden by default) -->
    <div id="app-screen" class="hidden flex-col h-full max-w-md mx-auto w-full bg-white shadow-2xl sm:border-x sm:border-gray-200 relative">
        
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-20 border-b border-gray-100 px-6 py-4 flex justify-between items-center">
            <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                Live Sync
            </h2>
            <div class="text-xs text-gray-400 font-mono">ID: <span id="room-id">...</span></div>
        </header>

        <!-- Tabs -->
        <div class="flex p-2 bg-gray-50 mx-4 mt-4 rounded-xl gap-2">
            <button onclick="switchTab('write')" id="tab-write" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow-sm text-blue-600 transition-all">
                Write
            </button>
            <button onclick="switchTab('read')" id="tab-read" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 hover:bg-gray-200 transition-all">
                Fetch History
            </button>
        </div>

        <!-- CONTENT AREA -->
        <div class="flex-1 overflow-y-auto p-4 relative">
            
            <!-- WRITE TAB -->
            <div id="view-write" class="tab-content active h-full flex flex-col">
                <textarea id="input-text" class="flex-1 w-full p-4 text-lg bg-gray-50 rounded-xl border border-transparent focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none resize-none transition-all placeholder-gray-400" placeholder="Paste text, links, or notes here..."></textarea>
                <div class="mt-4">
                    <button onclick="sendData()" id="send-btn" class="w-full bg-black text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
                        <span>Send to Vault</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                    </button>
                </div>
            </div>

            <!-- READ TAB -->
            <div id="view-read" class="tab-content pb-20">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Recent Clips</h3>
                    <button onclick="clearHistory()" class="text-xs text-red-500 hover:text-red-700 font-semibold">Clear All</button>
                </div>
                
                <div id="history-list" class="space-y-3">
                    <!-- Items injected here -->
                    <div class="text-center text-gray-400 mt-10">
                        <p>No clips found.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 transition-opacity pointer-events-none text-sm font-medium z-50 flex items-center gap-2">
            <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="toast-msg">Action Successful</span>
        </div>

    </div>

    <script>
        // --- CONFIG ---
        const AUTH = {
            pass: '98891998',
            url: 'https://xvldfsmxskhemkslsbym.supabase.co',
            key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2bGRmc214c2toZW1rc2xzYnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2ODgxNzksImV4cCI6MjA3ODI2NDE3OX0.5arqrx8Tt7v-hpXpo_ncoK4IX8th9IibxAuv93SSoOU'
        };
        
        let supabase;
        let ROOM_SLUG = '';
        let localClips = [];

        // --- AUTH & INIT ---
        const passInput = document.getElementById('pass-input');
        passInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPass(); });

        function checkPass() {
            if (passInput.value === AUTH.pass) {
                // Generate a consistent slug based on password so it's always the same room
                ROOM_SLUG = 'room-' + btoa(AUTH.pass).replace(/[^a-zA-Z0-9]/g, '').substring(0, 10);
                document.getElementById('room-id').innerText = ROOM_SLUG;
                
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('flex');
                
                initSupabase();
            } else {
                const err = document.getElementById('error-msg');
                err.classList.remove('hidden');
                passInput.classList.add('border-red-500');
                setTimeout(() => passInput.classList.remove('border-red-500'), 2000);
            }
        }

        function initSupabase() {
            supabase = supabase.createClient(AUTH.url, AUTH.key);
            
            // 1. Initial Load
            fetchClips();

            // 2. Realtime Listener
            supabase.channel('public:clips')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'clips', filter: `slug=eq.${ROOM_SLUG}` }, 
                    (payload) => {
                        if (payload.new && payload.new.content) {
                            parseAndRender(payload.new.content);
                            showToast('Sync: New data received');
                        }
                    }
                )
                .subscribe();
        }

        // --- LOGIC ---
        async function fetchClips() {
            const { data, error } = await supabase
                .from('clips')
                .select('content')
                .eq('slug', ROOM_SLUG)
                .single();

            if (error && error.code === 'PGRST116') {
                // No row exists yet, create it
                await supabase.from('clips').insert([{ slug: ROOM_SLUG, content: '[]' }]);
                localClips = [];
            } else if (data) {
                parseAndRender(data.content);
            }
        }

        function parseAndRender(jsonContent) {
            try {
                localClips = JSON.parse(jsonContent);
                if (!Array.isArray(localClips)) localClips = [];
                renderHistory();
            } catch (e) {
                console.error("Data corruption", e);
            }
        }

        async function sendData() {
            const input = document.getElementById('input-text');
            const text = input.value.trim();
            if (!text) return;

            const btn = document.getElementById('send-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">Syncing...</span>';
            btn.disabled = true;

            // Add new item to top
            const newItem = {
                id: Date.now(),
                text: text,
                date: new Date().toISOString()
            };
            
            // Update local first for speed
            localClips.unshift(newItem);
            
            // Limit to last 50 items to save space
            if (localClips.length > 50) localClips = localClips.slice(0, 50);

            // Push to DB
            const { error } = await supabase
                .from('clips')
                .update({ content: JSON.stringify(localClips) })
                .eq('slug', ROOM_SLUG);

            if (!error) {
                input.value = '';
                showToast('Sent to Vault');
                switchTab('read');
            } else {
                showToast('Error syncing');
            }

            btn.innerHTML = originalText;
            btn.disabled = false;
        }

        async function clearHistory() {
            if(!confirm('Delete all history?')) return;
            localClips = [];
            renderHistory();
            await supabase.from('clips').update({ content: '[]' }).eq('slug', ROOM_SLUG);
            showToast('History Cleared');
        }

        // --- UI ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            
            const tWrite = document.getElementById('tab-write');
            const tRead = document.getElementById('tab-read');
            
            if (tab === 'write') {
                tWrite.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow-sm text-blue-600 transition-all";
                tRead.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 hover:bg-gray-200 transition-all";
                document.getElementById('input-text').focus();
            } else {
                tRead.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white shadow-sm text-blue-600 transition-all";
                tWrite.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-gray-500 hover:bg-gray-200 transition-all";
                renderHistory();
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';

            if (localClips.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-400 mt-10"><p>No clips found.</p></div>';
                return;
            }

            localClips.forEach(clip => {
                const time = new Date(clip.date).toLocaleString(undefined, { 
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });
                
                const el = document.createElement('div');
                el.className = 'bg-white p-4 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow group relative';
                el.innerHTML = `
                    <div class="pr-10 text-gray-700 whitespace-pre-wrap font-mono text-sm break-words">${escapeHtml(clip.text)}</div>
                    <div class="mt-3 flex justify-between items-end border-t border-gray-50 pt-2">
                        <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">${time}</span>
                    </div>
                    <button onclick="copyText('${escapeJs(clip.text)}', this)" class="absolute top-3 right-3 bg-gray-50 p-2 rounded-lg text-gray-400 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    </button>
                `;
                list.appendChild(el);
            });
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard');
                btn.classList.add('text-green-500');
                setTimeout(() => btn.classList.remove('text-green-500'), 1000);
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('opacity-0', 'translate-y-4');
            t.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                t.classList.remove('opacity-100', 'translate-y-0');
                t.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"]/g, function(m) { return map[m]; });
        }
        
        function escapeJs(text) {
             return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '');
        }
    </script>
</body>
</html>
