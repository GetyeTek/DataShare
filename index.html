<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .tab-animate { animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        textarea::placeholder { color: #475569; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- PASSWORD OVERLAY -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <div class="mb-6">
                <div class="w-16 h-16 bg-blue-500 rounded-2xl mx-auto flex items-center justify-center shadow-xl shadow-blue-900/20">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-2xl font-bold mt-4 text-white">Sync Space</h1>
                <p class="text-slate-400 text-sm mt-1">Vault is encrypted</p>
            </div>
            <input type="password" id="pass-input" placeholder="••••" class="w-full text-center text-2xl tracking-widest p-4 rounded-xl border-2 border-slate-800 bg-slate-900 text-white focus:border-blue-500 focus:outline-none transition-all mb-4">
            <button onclick="checkPass()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl shadow-lg transition-all transform active:scale-95">
                Open Vault
            </button>
            <p id="error-msg" class="text-red-400 text-sm mt-3 hidden">Incorrect passcode</p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen" class="hidden flex-col h-full max-w-md mx-auto w-full bg-slate-900 shadow-2xl sm:border-x sm:border-slate-800 relative">
        
        <header class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                Live Vault
            </h2>
            <div class="text-[10px] text-slate-500 font-mono uppercase tracking-tighter"><span id="room-id">...</span></div>
        </header>

        <div class="flex p-1.5 bg-slate-950/50 mx-4 mt-4 rounded-xl gap-1 border border-slate-800">
            <button onclick="switchTab('write')" id="tab-write" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-white shadow-sm transition-all">
                Write
            </button>
            <button onclick="switchTab('read')" id="tab-read" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:bg-slate-800/50 transition-all">
                History
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 relative">
            <div id="view-write" class="tab-animate h-full flex flex-col">
                <textarea id="input-text" class="flex-1 w-full p-4 text-lg bg-slate-950 rounded-xl border border-slate-800 text-slate-200 focus:border-blue-500/50 outline-none resize-none transition-all" placeholder="Paste text or notes..."></textarea>
                <div class="mt-4">
                    <button onclick="sendData()" id="send-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
                        <span>Send to Vault</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                    </button>
                </div>
            </div>

            <div id="view-read" class="tab-animate hidden pb-20">
                <div class="flex justify-between items-center mb-4 px-2">
                    <div class="flex items-center gap-3">
                        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Recent Clips</h3>
                        <button onclick="refreshData(this)" class="bg-slate-800 p-1.5 rounded-md text-blue-400 hover:text-blue-300 transition-all active:rotate-180">
                            <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        </button>
                    </div>
                    <button onclick="clearHistory()" class="text-xs text-red-500/80 hover:text-red-400 font-bold uppercase tracking-tighter">Clear Vault</button>
                </div>
                
                <div id="history-list" class="space-y-3">
                    <!-- Items injected here -->
                    <div class="text-center text-gray-400 mt-10">
                        <p>No clips found.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 transition-all pointer-events-none text-sm font-bold z-50 flex items-center gap-2 translate-y-4">
            <span id="toast-msg">Action Successful</span>
        </div>

    </div>

    <script>
        // --- CONFIG ---
        const AUTH = {
            url: 'https://xvldfsmxskhemkslsbym.supabase.co',
            key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2bGRmc214c2toZW1rc2xzYnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2ODgxNzksImV4cCI6MjA3ODI2NDE3OX0.5arqrx8Tt7v-hpXpo_ncoK4IX8th9IibxAuv93SSoOU'
        };
        
        // Init immediately for auth check
        const db = supabase.createClient(AUTH.url, AUTH.key);
        let ROOM_SLUG = 'main-vault-01'; // Fixed room name so data persists even if password changes
        let localClips = [];

        // --- AUTH & INIT ---
        const passInput = document.getElementById('pass-input');
        passInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPass(); });

        async function checkPass() {
            const input = passInput.value;
            const btn = document.querySelector('button[onclick="checkPass()"]');
            const originalText = btn.innerHTML;
            
            btn.innerText = 'Verifying...';
            btn.disabled = true;

            try {
                // Fetch password from DB
                const { data } = await db.from('clips').select('content').eq('slug', 'config_password').single();
                const remotePass = data ? data.content : '98891998'; // Fallback if DB row missing

                if (input === remotePass) {
                    document.getElementById('room-id').innerText = 'Main Vault';
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    document.getElementById('app-screen').classList.add('flex');
                    startSync();
                } else {
                    throw new Error('Wrong password');
                }
            } catch (e) {
                const err = document.getElementById('error-msg');
                err.innerText = 'Incorrect passcode';
                err.classList.remove('hidden');
                passInput.classList.add('border-red-500');
                setTimeout(() => passInput.classList.remove('border-red-500'), 2000);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function refreshData(btn) {
            if(btn) btn.classList.add('animate-spin');
            await fetchClips();
            if(btn) setTimeout(() => btn.classList.remove('animate-spin'), 600);
            showToast('Vault Refreshed');
        }

        function startSync() {
            fetchClips();
            db.channel('public:clips')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'clips', filter: `slug=eq.${ROOM_SLUG}` }, 
                    (payload) => {
                        // Simple refresh for any change (insert/delete)
                        fetchClips();
                        if (payload.eventType === 'INSERT') showToast('New clip added');
                        if (payload.eventType === 'DELETE') showToast('Clip removed');
                    }
                )
                .subscribe();
        }

        // --- LOGIC ---
        async function fetchClips() {
            try {
                const { data, error } = await db
                    .from('clips')
                    .select('*')
                    .eq('slug', ROOM_SLUG)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                localClips = data || [];
                renderHistory();
            } catch (err) {
                console.error("Fetch failed:", err);
            }
        }

        function parseAndRender(jsonContent) {
            try {
                localClips = JSON.parse(jsonContent);
                if (!Array.isArray(localClips)) localClips = [];
                renderHistory();
            } catch (e) {
                console.error("Data corruption", e);
            }
        }

        async function sendData() {
            const input = document.getElementById('input-text');
            const text = input.value.trim();
            if (!text) return;

            const btn = document.getElementById('send-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">Syncing...</span>';
            btn.disabled = true;

            const { error } = await db
                .from('clips')
                .insert([{ 
                    slug: ROOM_SLUG, 
                    content: text, 
                    metadata: { source: 'web_app' }
                }]);

            if (!error) {
                input.value = '';
                showToast('Sent to Vault');
                switchTab('read');
                fetchClips();
            } else {
                showToast('Error syncing');
            }

            btn.innerHTML = originalText;
            btn.disabled = false;
        }

        async function clearHistory() {
            if(!confirm('Delete all history?')) return;
            const { error } = await db.from('clips').delete().eq('slug', ROOM_SLUG);
            if(!error) {
                localClips = [];
                renderHistory();
                showToast('Vault Cleared');
            }
        }

        async function deleteClip(id) {
            const { error } = await db.from('clips').delete().eq('id', id);
            if(!error) {
                localClips = localClips.filter(c => c.id !== id);
                renderHistory();
                showToast('Entry deleted');
            }
        }

        // --- UI ---
        function switchTab(tab) {
            const viewWrite = document.getElementById('view-write');
            const viewRead = document.getElementById('view-read');
            const tWrite = document.getElementById('tab-write');
            const tRead = document.getElementById('tab-read');

            if (tab === 'write') {
                viewWrite.classList.remove('hidden');
                viewRead.classList.add('hidden');
                tWrite.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-white shadow-sm transition-all";
                tRead.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:bg-slate-800/50 transition-all";
                document.getElementById('input-text').focus();
            } else {
                viewWrite.classList.add('hidden');
                viewRead.classList.remove('hidden');
                tRead.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-white shadow-sm transition-all";
                tWrite.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:bg-slate-800/50 transition-all";
                renderHistory();
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';

            if (localClips.length === 0) {
                list.innerHTML = '<div class="text-center text-slate-500 mt-10"><p>Vault is empty.</p></div>';
                return;
            }

            localClips.forEach(clip => {
                const time = new Date(clip.created_at).toLocaleString(undefined, { 
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });
                
                const el = document.createElement('div');
                el.className = 'bg-slate-950 rounded-xl border border-slate-800 shadow-xl overflow-hidden flex flex-col transition-all mb-4 w-full';
                el.innerHTML = `
                    <div class="max-h-80 overflow-y-auto p-4 bg-slate-950 border-b border-slate-900/50">
                        <pre class="text-blue-300 whitespace-pre-wrap font-mono text-xs sm:text-sm break-all select-all">${escapeHtml(clip.content)}</pre>
                    </div>
                    <div class="px-4 py-3 bg-slate-900 border-t border-slate-800 flex justify-between items-center shrink-0">
                        <div class="flex items-center gap-3">
                            <div class="flex flex-col">
                                <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Recorded</span>
                                <span class="text-[10px] text-slate-400 font-medium">${time}</span>
                            </div>
                            <button onclick="deleteClip('${clip.id}')" class="p-2 text-slate-600 hover:text-red-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        <button onclick="copyText('${escapeJs(clip.content)}', this)" class="flex items-center gap-2 text-[10px] font-black text-white py-2 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 active:scale-95 transition-all shadow-lg shadow-blue-900/20">
                             <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                             COPY
                        </button>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard');
                btn.classList.add('text-green-500');
                setTimeout(() => btn.classList.remove('text-green-500'), 1000);
            });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('opacity-0', 'translate-y-4');
            t.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                t.classList.remove('opacity-100', 'translate-y-0');
                t.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }

                function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        
        function escapeJs(text) {
             if (!text) return '';
             return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '').replace(/`/g, '\\`');
        }
    </script>
</body>
</html>
