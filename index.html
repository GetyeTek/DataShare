<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncSpace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
        
        <!-- Background Decoration -->
        <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
            <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
            <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-yellow-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
            <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
        </div>

        <!-- LOGIN SCREEN -->
        <div v-if="!isAuthenticated" class="glass-panel p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <div class="mb-6">
                <i class="fa-solid fa-lock text-4xl text-gray-700"></i>
            </div>
            <h2 class="text-2xl font-semibold mb-2 text-gray-800">Unlock Space</h2>
            <p class="text-gray-500 mb-6 text-sm">Enter your access code to continue.</p>
            <form @submit.prevent="checkPassword">
                <input 
                    v-model="passwordInput" 
                    type="password" 
                    pattern="[0-9]*" 
                    inputmode="numeric" 
                    placeholder="Passcode" 
                    class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black mb-4 text-center text-lg tracking-widest"
                >
                <button 
                    type="submit" 
                    class="w-full bg-black text-white py-3 rounded-xl font-medium hover:bg-gray-800 transition-all active:scale-95"
                >
                    Enter
                </button>
            </form>
            <p v-if="authError" class="text-red-500 text-sm mt-3">Incorrect passcode</p>
        </div>

        <!-- MAIN APP -->
        <div v-else class="w-full max-w-md h-[85vh] flex flex-col bg-white rounded-3xl shadow-2xl overflow-hidden relative">
            
            <!-- Header -->
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-white z-10">
                <div>
                    <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-brands fa-space-awesome text-indigo-500"></i> SyncSpace
                    </h1>
                    <p class="text-xs text-gray-400 font-mono mt-1">Room: {{ displaySlug }}</p>
                </div>
                <div class="flex gap-2">
                    <button @click="copyRoomUrl" class="p-2 text-gray-400 hover:text-gray-600 transition">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                    <div class="h-2 w-2 rounded-full mt-3" :class="connected ? 'bg-green-500' : 'bg-red-500'"></div>
                </div>
            </div>

            <!-- Tabs Switcher -->
            <div class="flex p-2 bg-gray-50 mx-4 mt-4 rounded-xl">
                <button 
                    @click="activeTab = 'write'" 
                    class="flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200"
                    :class="activeTab === 'write' ? 'bg-white text-black shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                >
                    <i class="fa-solid fa-pen-nib mr-2"></i>Write
                </button>
                <button 
                    @click="activeTab = 'read'" 
                    class="flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200"
                    :class="activeTab === 'read' ? 'bg-white text-black shadow-sm' : 'text-gray-500 hover:text-gray-700'"
                >
                    <i class="fa-solid fa-layer-group mr-2"></i>Fetch ({{ clips.length }})
                </button>
            </div>

            <!-- CONTENT AREA -->
            <div class="flex-1 overflow-hidden relative">
                
                <!-- WRITE TAB -->
                <transition name="fade">
                    <div v-if="activeTab === 'write'" class="absolute inset-0 p-5 flex flex-col">
                        <textarea 
                            v-model="newContent" 
                            class="flex-1 w-full resize-none bg-gray-50 border-0 rounded-2xl p-4 text-gray-700 placeholder-gray-400 focus:ring-0 text-lg leading-relaxed"
                            placeholder="Type something here to sync..."
                        ></textarea>
                        <div class="mt-4">
                            <button 
                                @click="saveClip" 
                                :disabled="isSaving || !newContent.trim()"
                                class="w-full py-4 rounded-xl font-semibold text-white shadow-lg transition-all flex items-center justify-center gap-2"
                                :class="isSaving ? 'bg-gray-400' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-95'"
                            >
                                <i v-if="isSaving" class="fa-solid fa-circle-notch fa-spin"></i>
                                <span v-else>Sync to Cloud <i class="fa-solid fa-paper-plane ml-1"></i></span>
                            </button>
                        </div>
                    </div>
                </transition>

                <!-- READ TAB -->
                <transition name="fade">
                    <div v-if="activeTab === 'read'" class="absolute inset-0 overflow-y-auto p-4 bg-gray-50">
                        
                        <!-- Sorting & Controls -->
                        <div class="flex justify-between items-center mb-4 px-1">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">History</span>
                            <button @click="toggleSort" class="text-xs font-medium text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                                <i class="fa-solid" :class="sortDesc ? 'fa-arrow-down-wide-short' : 'fa-arrow-up-wide-short'"></i> 
                                {{ sortDesc ? 'Newest' : 'Oldest' }}
                            </button>
                        </div>

                        <!-- Empty State -->
                        <div v-if="clips.length === 0" class="text-center mt-20 opacity-50">
                            <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
                            <p>No clips yet.</p>
                        </div>

                        <!-- List -->
                        <div v-for="clip in sortedClips" :key="clip.id" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3 group animate-slide-up">
                            <div class="text-gray-800 text-sm whitespace-pre-wrap leading-relaxed break-words">{{ clip.text }}</div>
                            <div class="mt-3 flex justify-between items-center pt-3 border-t border-gray-50">
                                <span class="text-[10px] text-gray-400 font-mono">{{ formatDate(clip.timestamp) }}</span>
                                <button 
                                    @click="copyToClipboard(clip.text, $event)" 
                                    class="text-gray-400 hover:text-indigo-600 transition-colors p-1"
                                >
                                    <i class="fa-regular fa-copy"></i> <span class="text-xs ml-1">Copy</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </transition>
            </div>

            <!-- Notification Toast -->
            <div v-if="toastMsg" class="absolute bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs py-2 px-4 rounded-full shadow-lg z-50 flex items-center gap-2">
                <i class="fa-solid fa-check-circle text-green-400"></i> {{ toastMsg }}
            </div>

        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;

        // --- SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://xvldfsmxskhemkslsbym.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2bGRmc214c2toZW1rc2xzYnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2ODgxNzksImV4cCI6MjA3ODI2NDE3OX0.5arqrx8Tt7v-hpXpo_ncoK4IX8th9IibxAuv93SSoOU';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        createApp({
            setup() {
                // State
                const isAuthenticated = ref(false);
                const passwordInput = ref('');
                const authError = ref(false);
                const activeTab = ref('write');
                const newContent = ref('');
                const clips = ref([]);
                const isSaving = ref(false);
                const connected = ref(false);
                const toastMsg = ref('');
                const sortDesc = ref(true);

                // Logic to handle Room ID (Slug)
                const getSlug = () => {
                    let hash = window.location.hash.substring(1);
                    if (!hash) {
                        hash = Math.random().toString(36).substring(2, 8);
                        window.location.hash = hash;
                    }
                    return hash;
                };
                const slug = ref(getSlug());
                const displaySlug = computed(() => slug.value);

                // --- Auth ---
                const checkPassword = () => {
                    if (passwordInput.value === '98891998') {
                        isAuthenticated.value = true;
                        initApp();
                    } else {
                        authError.value = true;
                        passwordInput.value = '';
                    }
                };

                // --- Data Sync ---
                const initApp = async () => {
                    await fetchClips();
                    setupRealtime();
                };

                const fetchClips = async () => {
                    const { data, error } = await supabase
                        .from('clips')
                        .select('content')
                        .eq('slug', slug.value)
                        .single();
                    
                    if (data && data.content) {
                        try {
                            // We expect content to be a JSON string of array
                            // If it's plain text (legacy), we wrap it
                            if (data.content.startsWith('[')) {
                                clips.value = JSON.parse(data.content);
                            } else if (data.content) {
                                clips.value = [{ id: Date.now(), text: data.content, timestamp: Date.now() }];
                            }
                        } catch (e) {
                            clips.value = [];
                        }
                    } else {
                        // Create room if not exists
                        await supabase.from('clips').insert([{ slug: slug.value, content: '[]' }]);
                        clips.value = [];
                    }
                    connected.value = true;
                };

                const saveClip = async () => {
                    if (!newContent.value.trim()) return;
                    isSaving.value = true;

                    const newEntry = {
                        id: Date.now().toString(36) + Math.random().toString(36).substr(2),
                        text: newContent.value,
                        timestamp: Date.now()
                    };

                    // Optimistic Update
                    const updatedClips = [...clips.value, newEntry];
                    clips.value = updatedClips;

                    // Send to DB
                    const { error } = await supabase
                        .from('clips')
                        .update({ content: JSON.stringify(updatedClips) })
                        .eq('slug', slug.value);

                    if (!error) {
                        newContent.value = '';
                        activeTab.value = 'read'; // Auto switch to history
                        showToast('Clip saved!');
                    } else {
                        showToast('Error saving');
                    }
                    isSaving.value = false;
                };

                // --- Realtime ---
                const setupRealtime = () => {
                    supabase.channel('room-updates')
                        .on('postgres_changes', 
                            { event: 'UPDATE', schema: 'public', table: 'clips', filter: `slug=eq.${slug.value}` }, 
                            (payload) => {
                                if (payload.new && payload.new.content) {
                                    try {
                                        const remoteClips = JSON.parse(payload.new.content);
                                        // Simple sync: Remote wins
                                        if (JSON.stringify(remoteClips) !== JSON.stringify(clips.value)) {
                                            clips.value = remoteClips;
                                            showToast('Updated from other device');
                                        }
                                    } catch(e) {}
                                }
                            }
                        )
                        .subscribe((status) => {
                             if (status === 'SUBSCRIBED') connected.value = true;
                        });
                };

                // --- Utilities ---
                const sortedClips = computed(() => {
                    return [...clips.value].sort((a, b) => {
                        return sortDesc.value 
                            ? b.timestamp - a.timestamp 
                            : a.timestamp - b.timestamp;
                    });
                });

                const toggleSort = () => sortDesc.value = !sortDesc.value;

                const copyToClipboard = (text, event) => {
                    navigator.clipboard.writeText(text).then(() => {
                        const btn = event.currentTarget;
                        const originalHTML = btn.innerHTML;
                        btn.innerHTML = '<i class="fa-solid fa-check text-green-500"></i> <span class="text-green-600 font-bold text-xs ml-1">Copied!</span>';
                        setTimeout(() => btn.innerHTML = originalHTML, 2000);
                    });
                };

                const copyRoomUrl = () => {
                   navigator.clipboard.writeText(window.location.href);
                   showToast('Room link copied!');
                };

                const showToast = (msg) => {
                    toastMsg.value = msg;
                    setTimeout(() => toastMsg.value = '', 3000);
                };

                const formatDate = (ts) => {
                    return new Date(ts).toLocaleString();
                };

                return {
                    isAuthenticated, passwordInput, authError, checkPassword,
                    activeTab, newContent, clips, saveClip, isSaving,
                    connected, sortedClips, toggleSort, sortDesc,
                    copyToClipboard, displaySlug, toastMsg, copyRoomUrl, formatDate
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
